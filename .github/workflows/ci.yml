name: ci
on: [push, pull_request]
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSYS2 (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: curl tar unzip
      - name: Install jolt (unix)
        if: runner.os != 'Windows'
        run: curl -sL https://raw.githubusercontent.com/jolt-lang/jolt/main/install | bash -s -- --version 0.8.28
      - name: Install jolt (windows)
        if: runner.os == 'Windows'
        run: |
          ws_msys="$(cygpath -u "$GITHUB_WORKSPACE")"
          cd "$ws_msys"
          curl -sL -o jolt.zip https://github.com/jolt-lang/jolt/releases/download/v0.8.28/jolt-v0.8.28-x86_64-windows.zip
          unzip -q jolt.zip
      - name: Test (unix)
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          jolt test
      - name: Test (windows)
        if: runner.os == 'Windows'
        run: |
          ws_msys="$(cygpath -u "$GITHUB_WORKSPACE")"
          "$ws_msys/jolt-v0.8.28-x86_64-windows/jolt.exe" test
      # Boot tests need /dev/kvm (Linux) or Hypervisor.framework (macOS) plus a
      # libkrun 2.0 build; run those on a self-hosted runner:
      #   jolt run test/jolt/sandbox_test.clj
